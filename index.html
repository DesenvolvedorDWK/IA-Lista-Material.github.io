<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
<https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.jsscript>
<script src="script.js"></script>
<script src="rfid.js"></script>
<script src="excel.js"></script>
<script src="api.js"></script>

    <title>Sistema Inteligente de Peças IA</title>

    <!-- CSS PRINCIPAL -->
    <link rel="stylesheet" href="style.css">

    <!-- BIBLIOTECA EXCEL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>

    <header>
        <h1>Sistema Inteligente de Peças IA</h1>
        <p id="ultimaAtualizacao">Última atualização: -</p>
    </header>

    <nav class="menu">
        <button onclick="abrirDashboard()">Dashboard IA</button>
        <button onclick="abrirRFID()">RFID</button>
        <button onclick="exportarExcel()">Exportar Excel</button>
    </nav>

    <main class="container">

        <section class="cadastro">

            <h2>Cadastro de Peças</h2>

            <input
                type="text"
                id="codigo"
                placeholder="Código">

            <input
                type="text"
                id="descricao"
                placeholder="Descrição">

            <input
                type="number"
                id="quantidade"
                placeholder="Quantidade">

            <br>

            <button onclick="adicionarPeca()">
                Adicionar Peça
            </button>

        </section>

        <section class="lista">

            <h2>Lista de Peças</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Ação</th>
                    </tr>
                </thead>

                <tbody id="tabelaPecas">

                </tbody>
            </table>

        </section>

    </main>

    <!-- JAVASCRIPT PRINCIPAL -->
    script.jsscript>

    <!-- RFID -->
    rfid.jsscript>

    <!-- EXPORTAÇÃO EXCEL -->
    excel.jsscript>

    <!-- API / IA -->
    api.jsscript>

</body>

</html>
