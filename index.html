<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema Inteligente de Peças IA</title>

    <!-- CSS PRINCIPAL -->
    <link rel="stylesheet" href="style.css">

-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5n.jsscript>

</head>

<body>

    <!-- CABEÇALHO -->

    <header>

        <h1>Sistema Inteligente de Peças IA</h1>

        <p id="ultimaAtualizacao">
            Última atualização: -
        </p>

    </header>

    <!-- MENU -->

    <nav class="menu">

        <button onclick="abrirDashboard()">
            Dashboard IA
        </button>

        <button onclick="abrirRFID()">
            RFID
        </button>

        <button onclick="exportarExcel()">
            Exportar Excel
        </button>

    </nav>

    <!-- CONTEÚDO -->

    <main class="container">

        <section class="cadastro">

            <h2>Cadastro de Peças</h2>

            <input
                type="text"
                id="codigo"
                placeholder="Código">

            <input
                type="text"
                id="descricao"
                placeholder="Descrição">

            <input
                type="number"
                id="quantidade"
                placeholder="Quantidade">

            <br>

            <button onclick="adicionarPeca()">
                Adicionar Peça
            </button>

        </section>

        <section class="lista">

            <h2>Lista de Peças</h2>

            <table>

                <thead>

                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Ação</th>
                    </tr>

                </thead>

                <tbody id="tabelaPecas">

                </tbody>

            </table>

        </section>

    </main>

    <!-- SCRIPT PRINCIPAL IA -->
    script.jsscript>

    <!-- RFID -->
    rfid.jsscript>

    <!-- EXPORTAÇÃO EXCEL -->
    excel.jsscript>

    <!-- API / IA -->
    api.jsscript>

</body>

</html>
